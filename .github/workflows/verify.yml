name: Verify pull request
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - name: Upload question quality audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: question-quality-audit
          path: |
            reports/question-audit.json
            reports/question-audit.md
            reports/editorial-evidence-2026-10-24.json
            reports/overdrive-5-7-review-batch.json
            reports/overdrive-5-8-overlap-triage.json
            reports/human-review-decisions.json
            reports/independent-review-queue.json
            reports/independent-review-queue.md
          if-no-files-found: warn
          retention-days: 14
