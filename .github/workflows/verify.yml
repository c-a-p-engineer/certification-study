name: Verify pull request
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - name: Upload question quality audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: question-quality-audit
          path: reports/question-audit.json
          if-no-files-found: warn
          retention-days: 14
